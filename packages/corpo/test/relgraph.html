<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CpRelGraph — perf harness</title>
<link rel="stylesheet" href="../dist/corpo.css">
<style>
  body { margin: 0; padding: 16px; background: var(--corpo-bg); font-family: var(--corpo-font-sans); color: var(--corpo-text); }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .stats { font-family: var(--corpo-font-mono); font-size: var(--corpo-text-sm); color: var(--corpo-text-secondary); }
  #graph { height: calc(100vh - 110px); }
  .hint { font-size: var(--corpo-text-xs); color: var(--corpo-text-muted); }
</style>
</head>
<body>
<div class="bar">
  <span class="corpo-label corpo-label--wide">CpRelGraph perf harness</span>
  <select id="size" class="cp-select" style="width:auto">
    <option value="1000">1k nodes</option>
    <option value="5000">5k nodes</option>
    <option value="10000" selected>10k nodes</option>
    <option value="20000">20k nodes</option>
  </select>
  <select id="layout" class="cp-select" style="width:auto">
    <option value="preset" selected>preset</option>
    <option value="force">force</option>
    <option value="radial">radial</option>
    <option value="tiers">tiers</option>
  </select>
  <select id="labels" class="cp-select" style="width:auto">
    <option value="lod" selected>lod labels</option>
    <option value="gutter">gutter labels</option>
    <option value="focus">focus labels</option>
  </select>
  <select id="kind" class="cp-select" style="width:auto">
    <option value="" selected>all kinds</option>
    <option value="service">service</option>
    <option value="database">database</option>
    <option value="queue">queue</option>
    <option value="external">external</option>
    <option value="job">job</option>
    <option value="ui">ui</option>
  </select>
  <select id="theme" class="cp-select" style="width:auto">
    <option value="">teal</option>
    <option value="theme-amber">amber</option>
    <option value="theme-green">green</option>
    <option value="theme-red">red</option>
    <option value="theme-steel">steel</option>
  </select>
  <input id="search" class="cp-input cp-input--sm cp-input--accent" placeholder="Search" aria-label="Search nodes" style="width:140px">
  <button id="scope" class="cp-btn cp-btn--sm">Scope</button>
  <button id="unscope" class="cp-btn cp-btn--sm">Clear scope</button>
  <button id="fit" class="cp-btn">Fit (0)</button>
  <span id="stats" class="stats"></span>
</div>
<p class="hint">Drag a node to move it. Shift-drag to box-select. Double-click a node to drill in. ] [ cycle search hits.</p>
<div id="graph"></div>

<script type="module">
import { CpRelGraph } from '../src/js/relgraph.js';

function mulberry32(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const KINDS = ['service', 'database', 'queue', 'external', 'job', 'ui'];
const GA = Math.PI * (3 - Math.sqrt(5));

function makeGraph(total) {
  const rand = mulberry32(42);
  const clusterCount = Math.max(6, Math.round(Math.sqrt(total) / 2));
  const size = Math.floor(total / clusterCount);
  const nodes = [];
  const edges = [];
  const clusterR = 14 * Math.sqrt(size);
  for (let c = 0; c < clusterCount; c++) {
    const cd = clusterR * 2.4 * Math.sqrt(c + 0.5);
    const cx = Math.cos(c * GA) * cd;
    const cy = Math.sin(c * GA) * cd;
    const hub = `c${c}-hub`;
    const group = `cluster-${c}`;
    nodes.push({ id: hub, label: `gateway-${c}`, kind: 'service', group, x: cx, y: cy, r: 7 });
    for (let i = 1; i < size; i++) {
      const id = `c${c}-n${i}`;
      const d = 14 * Math.sqrt(i + 0.5);
      nodes.push({
        id,
        label: `${KINDS[i % KINDS.length]}-${c}-${i}`,
        kind: KINDS[i % KINDS.length],
        group,
        parent: hub,
        x: cx + Math.cos(i * GA) * d,
        y: cy + Math.sin(i * GA) * d,
      });
      edges.push({ source: hub, target: id });
      if (i > 1 && rand() < 0.6) edges.push({ source: `c${c}-n${1 + Math.floor(rand() * (i - 1))}`, target: id });
    }
    if (c > 0) {
      edges.push({ source: `c${Math.floor(rand() * c)}-hub`, target: hub });
      edges.push({ source: `c${Math.floor(rand() * c)}-hub`, target: hub });
    }
  }
  return { nodes, edges };
}

const host = document.getElementById('graph');
const stats = document.getElementById('stats');
let model = makeGraph(10000);
let buildMs = 0;

let t0 = performance.now();
let layoutStart = 0;
let layoutMs = null;
const api = CpRelGraph(host, {
  ...model,
  onSelect: (id) => { selectedId = id; },
  onScope: (id) => { scopeId = id; },
  onLayoutEnd: (name) => { if (name === 'force') layoutMs = performance.now() - layoutStart; },
});
buildMs = performance.now() - t0;
let selectedId = null;
let scopeId = null;
window.relgraph = api;

document.getElementById('layout').addEventListener('change', (e) => {
  layoutMs = null;
  layoutStart = performance.now();
  api.runLayout(e.target.value);
});

document.getElementById('labels').addEventListener('change', (e) => {
  api.setLabels(e.target.value);
});

document.getElementById('kind').addEventListener('change', (e) => {
  api.setFilters({ kinds: e.target.value ? [e.target.value] : [] });
});

document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  api.search(e.target.value);
});

document.getElementById('scope').addEventListener('click', () => {
  if (selectedId) api.setScope(selectedId);
});

document.getElementById('unscope').addEventListener('click', () => api.setScope(null));

document.getElementById('size').addEventListener('change', (e) => {
  model = makeGraph(Number(e.target.value));
  t0 = performance.now();
  api.replaceModel(model);
  buildMs = performance.now() - t0;
});

document.getElementById('theme').addEventListener('change', (e) => {
  document.documentElement.className = e.target.value;
  api.refreshTheme();
});

document.getElementById('fit').addEventListener('click', () => api.fit());

// FPS: count frames only while the graph is actually repainting (rAF-driven),
// measured against a continuously running sampler.
let frames = 0;
let last = performance.now();
function sample(now) {
  frames++;
  if (now - last >= 1000) {
    const fps = Math.round((frames * 1000) / (now - last));
    const extra = [
      layoutMs !== null ? `settle ${(layoutMs / 1000).toFixed(1)}s` : null,
      selectedId ? `selected ${selectedId}` : null,
      scopeId ? `scope ${scopeId}` : null,
    ].filter(Boolean).join(' · ');
    stats.textContent = `${model.nodes.length.toLocaleString()} nodes · ${model.edges.length.toLocaleString()} edges · build ${buildMs.toFixed(1)}ms · ${fps}fps${extra ? ` · ${extra}` : ''}`;
    frames = 0;
    last = now;
  }
  requestAnimationFrame(sample);
}
requestAnimationFrame(sample);
</script>
</body>
</html>
